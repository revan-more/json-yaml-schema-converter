[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "json-yaml-schema-converter"
dynamic = ["version"]
description = "Convert JSON API responses to YAML schema format with properties, types, and titles"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "revanmore", email = "revanmore12@gmail.com"}
]
keywords = ["json", "yaml", "schema", "converter", "api", "openapi", "swagger"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0"
]

[project.urls]
Homepage = "https://github.com/revan-more/json-yaml-schema-converter"
"Bug Reports" = "https://github.com/revan-more/json-yaml-schema-converter/issues"
"Source Code" = "https://github.com/revan-more/json-yaml-schema-converter"

[project.scripts]
json2yaml-schema-converter = "json_yaml_schema_converter.converter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["json_yaml_schema_converter*"]

[tool.setuptools.package-data]
json_yaml_schema_converter = ["*.txt", "*.md"]